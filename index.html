<style>
  :root { --bg: #0b1020; --panel: #151c30; --panel-2: #1e2742; --line: #2c3a5c; --ink: #f4f6fb; --muted: #aab4ca;

  .iconbtn { background: var(--panel-2); border: 0; min-width: 42px; min-height: 42px; font-size: 1.15rem; box-shadow: 0 0 0 2px var(--line); flex: none; }

  .hud { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 6px; }

  .meter.low .bar i { background: repeating-linear-gradient(90deg, var(--low) 0 6px, #000 6px 9px); }
  .meter .sub { font: .72rem/1.2 ui-monospace, Consolas, monospace; color: var(--muted); margin-top: 4px; }
  @keyframes pulse { 50% { box-shadow: inset 0 0 0 3px #000; } }

  .stars .bar { flex: 1; height: 14px; background: #000; box-shadow: 0 0 0 2px var(--line); }
  .stars .bar i { display: block; height: 100%; background: var(--sun); transition: width .6s; }
  .forecast { display: flex; gap: 3px; align-items: center; }

  .stage { position: relative; box-shadow: 0 0 0 3px var(--line); background: #000; touch-action: manipulation; }
  canvas#base { display: block; width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; touch-action: manipulation; }
  .gender { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .gender .big { margin-top: 0; }
  .sunbtn { position: absolute; border: 0; background: transparent; border-radius: 50%; }

  .bulbs { position: absolute; inset: 54.545% 0 0 0; pointer-events: none; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }

  .bulb.off { box-shadow: 0 0 0 2px var(--muted); filter: grayscale(1); }

  .roomtop.show { display: flex; }
  .roomtop .back { min-height: 44px; padding: 0 12px; border: 0; background: var(--sun); color: #000; font-weight: 900; }

  .panel { margin-top: 8px; }

  .crew canvas { width: 56px; height: 56px; image-rendering: pixelated; }
  .crew b { font-size: .85rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
  .crew small { font-size: .72rem; color: var(--muted); }
  .crew.sel { box-shadow: inset 0 0 0 3px var(--sun); background: #2a2a10; }
  .crew.busy small { color: var(--ink); }
  .crew .you { font: 800 .6rem ui-monospace, monospace; background: #ff9a3c; color: #000; padding: 1px 4px; }
  .say { color: var(--muted); font-size: .92rem; margin: 6px 2px; text-align: center; }
  .big { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; margin-top: 8px; min-height: 58px; padding: 8px 12px; background: var(--panel-2); border: 0; box-shadow: 0 0 0 2px var(--line); font-weight: 700; }
  .big .e { font-size: 1.7rem; }
  .big small { display: block; font-weight: 400; color: var(--muted); font-size: .82rem; }
  .big.on { box-shadow: 0 0 0 3px var(--ok); }
  .big.primary { background: var(--sun); color: #000; } .big.primary small { color: #333; }
  .ctx { background: var(--panel); box-shadow: inset 0 0 0 2px var(--line); padding: 8px 10px; margin-top: 6px; }
  .ctx .stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .ctx .stats span { background: #000; padding: 4px 8px; font: 700 .8rem ui-monospace, Consolas, monospace; box-shadow: 0 0 0 1px var(--line); }
  .ctx .whatif { margin: 8px 0 0; }
  .ctx .fact { margin-top: 8px; font-size: .9rem; color: var(--ink); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; background: #000; border: 0; box-shadow: 0 0 0 2px var(--line); font-size: .9rem; min-height: 40px; }
  .dot { width: 12px; height: 12px; display: inline-block; }

  .bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; justify-content: center; padding: 10px; background: linear-gradient(transparent, var(--bg) 35%); z-index: 5; }
  .bottom .end { flex: 1; max-width: 460px; min-height: 56px; background: var(--sun); color: #000; border: 0; font-weight: 900; font-size: 1.15rem; letter-spacing: .06em; }
  .bottom .skip { min-height: 56px; background: var(--panel-2); border: 0; box-shadow: 0 0 0 2px var(--line); padding: 0 14px; font-size: 1.2rem; }

  .coach { position: fixed; left: 50%; transform: translateX(-50%); bottom: 84px; z-index: 15; width: min(94vw, 520px); display: none; gap: 10px; align-items: center;
    background: #fffbe0; color: #111; padding: 10px 12px; box-shadow: 0 0 0 3px #000, 0 0 0 6px var(--sun); }
  .coach.show { display: flex; }
  .coach img { width: 56px; height: 56px; image-rendering: pixelated; flex: none; }
  .coach p { margin: 0; font-weight: 700; flex: 1; }
  .coach button { border: 0; background: #111; color: #fff; font-weight: 800; padding: 8px 10px; min-height: 40px; }
  .coach button.skip { background: none; color: #555; text-decoration: underline; font-weight: 400; padding: 0; min-height: 0; }
  .coach .btns { display: grid; gap: 6px; flex: none; }
  .coach #coachmore { background: #fff; color: #111; box-shadow: inset 0 0 0 2px #111; }
  .target { position: relative; z-index: 12; animation: tgt .7s steps(2) infinite; }
  @keyframes tgt { 50% { outline: 4px solid var(--sun); outline-offset: 2px; } }

  .modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.62); padding: 10px; }
  .modal.show { display: flex; }
  .card { width: 100%; max-width: 520px; background: var(--panel); padding: 14px; box-shadow: 0 0 0 3px var(--sun); max-height: 92vh; overflow: auto; }
  .card h2 { margin: 0 0 8px; font-size: 1.15rem; }
  .card h3 { margin: 14px 0 4px; font-size: 1rem; }
  .card p { margin: 6px 0; }
  .card input[type=text] { width: 100%; font: 700 1.3rem/1 system-ui, sans-serif; padding: 12px; margin: 10px 0 6px; background: #000; color: var(--ink); border: 0; box-shadow: 0 0 0 3px var(--sun); }
  .card label { display: flex; gap: 8px; align-items: center; margin-top: 10px; min-height: 40px; }
  .card label input { width: 22px; height: 22px; }
  .mc { display: flex; gap: 10px; align-items: flex-start; }
  .mc img { width: 64px; height: 64px; image-rendering: pixelated; flex: none; background: #0b1630; box-shadow: 0 0 0 2px var(--info); }
  .mc .bubble { flex: 1; background: var(--panel-2); padding: 8px 10px; box-shadow: 0 0 0 2px var(--line); }
  .maplink { display: inline-block; margin-top: 4px; padding: 8px 12px; background: #000; color: var(--info); font-weight: 800; box-shadow: 0 0 0 2px var(--info); text-decoration: none; }
  /* Small "AI art" mark on every AI-generated image (Space Apps rule: a visible watermark). */
  .aiwrap { position: relative; display: inline-block; flex: none; line-height: 0; }
  .aitag { position: absolute; right: 2px; bottom: 2px; font: 700 9px/1 ui-monospace, Consolas, monospace; font-style: normal; color: #fff; background: rgba(0,0,0,.6); padding: 2px 3px; pointer-events: none; }
  .mission .aitag { bottom: auto; top: 4px; left: 4px; right: auto; }
  .aimark { position: fixed; left: 4px; bottom: 4px; z-index: 30; font: 700 9px/1 ui-monospace, Consolas, monospace; color: #fff; background: rgba(0,0,0,.6); padding: 2px 4px; pointer-events: none; } /* the icons are AI pixel art */
  .noai .aitag { display: none; } .noai .aimark { display: none; } /* private mode only: ?mc= or ?clean= with the owner passphrase (js/game.js → unlockName) */
  /* 10-second walk outside after the Science trip puzzle (js/eva.js): a tiny canvas scaled up with crisp pixels */
  .eva { position: relative; margin-top: 8px; } .eva canvas { display: block; width: 100%; aspect-ratio: 192 / 120; image-rendering: pixelated; background: #000; box-shadow: 0 0 0 3px #000, 0 0 0 5px var(--line); cursor: pointer; }
  .eva .evaskip { display: block; margin: 6px 0 0 auto; background: var(--panel-2); color: #fff; border: 0; box-shadow: 0 0 0 2px var(--line); padding: 6px 12px; font-weight: 700; min-height: 40px; }
  /* room minigames: memory, route, boxes */
  .memo { display: grid; grid-template-columns: repeat(4, calc(var(--cs) * 1.3)); gap: 8px; perspective: 700px; }
  .mcard { position: relative; width: calc(var(--cs) * 1.3); height: calc(var(--cs) * 1.45); border: 0; padding: 0; background: none; transform-style: preserve-3d; transition: transform .35s; }
  .mcard span { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; backface-visibility: hidden; box-shadow: inset 0 0 0 2px var(--line); }
  .mcard .back { background: #23305a; color: var(--info); font: 900 calc(var(--cs) * .5) ui-monospace, monospace; }
  .mcard .front { background: var(--panel-2); transform: rotateY(180deg); font-size: calc(var(--cs) * .55); line-height: 1.1; }
  .mcard .front small { font-size: calc(var(--cs) * .17); color: var(--muted); }
  .mcard.up, .mcard.done { transform: rotateY(180deg); } .mcard.done .front { box-shadow: inset 0 0 0 3px var(--ok); }
  .zip { position: relative; display: grid; grid-template-columns: repeat(var(--n), var(--cs)); touch-action: none; user-select: none; }
  .zc { width: var(--cs); height: var(--cs); border: 0; background: #2b2f3a; box-shadow: inset 0 0 0 1px var(--line); color: #000; position: relative; z-index: 1; }
  .zc.on { background: rgba(86,180,233,.28); } .zc.head { background: rgba(240,228,66,.45); }
  .zc b { display: inline-grid; place-items: center; width: calc(var(--cs) * .58); height: calc(var(--cs) * .58); border-radius: 50%; background: var(--sun); font: 900 calc(var(--cs) * .3) ui-monospace, monospace; }
  .zipline { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .zipline polyline { fill: none; stroke: var(--info); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .zc { background: transparent; } .zip { background: #2b2f3a; }
  .patch { position: relative; display: grid; grid-template-columns: repeat(var(--w), var(--cs)); touch-action: none; user-select: none; background: #1b1f29; }
  .pc { width: var(--cs); height: var(--cs); border: 0; background: transparent; box-shadow: inset 0 0 0 1px var(--line); position: relative; z-index: 2; color: #fff; }
  .pc b { font: 900 calc(var(--cs) * .4) ui-monospace, monospace; text-shadow: 0 1px 0 #000; } .pc.pend { box-shadow: inset 0 0 0 3px var(--sun); }
  .boxes { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .boxes i { position: absolute; box-sizing: border-box; border: 3px solid #000; opacity: .9; }
  .boxes i.bad { border-color: var(--low); } .boxes i.good { border-color: #000; } .boxes i.prev { border: 3px dashed var(--sun); background: rgba(240,228,66,.15); opacity: 1; }
  .mgsmall { border: 0; background: var(--panel-2); box-shadow: 0 0 0 2px var(--line); padding: 8px 12px; min-height: 40px; font-weight: 700; }
  .tile.ripe { box-shadow: inset 0 0 0 3px var(--ok); animation: tgt .7s steps(2) infinite; }
  /* room minigames (older) */
  .big.mg { box-shadow: 0 0 0 3px var(--info); }
  .mg { --cs: clamp(48px, calc((100vw - 70px) / 6), 74px); margin-top: 10px; display: grid; justify-items: center; gap: 8px; }
  .card.mgcard { max-width: 640px; }
  /* rewards after a puzzle */
  .burst { position: relative; height: 0; pointer-events: none; }
  .burst i { position: absolute; left: 50%; top: 40px; width: 8px; height: 8px; opacity: 0; animation: boom .9s ease-out forwards; }
  @keyframes boom { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }
  h2.cheer { font-size: 1.6rem; text-align: center; color: var(--sun); animation: cheer .6s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes cheer { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .rate { display: flex; justify-content: center; gap: 10px; margin: 2px 0 4px; }
  .rate span { font-size: 2.6rem; line-height: 1; color: #3a4252; }
  .rate span.on { color: var(--sun); animation: starpop .45s cubic-bezier(.2, 1.8, .4, 1) both; text-shadow: 0 0 12px rgba(240,228,66,.7); }
  @keyframes starpop { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: scale(1) rotate(0); } }
  .wins { text-align: center; font-weight: 700; } .wins .rec { color: var(--sun); }
  .mcard.done .front { animation: pop .35s ease-out; } .zc.head { animation: pop .18s ease-out; } .boxes i.good { animation: pop .3s ease-out; }
  .tip.show { animation: shake .3s; }
  /* 🌱 garden minigame (js/minigames.js → tend): a ring shows how much each plant has grown (and, when ripe, how long until it wilts) */
  .basket { display: flex; align-items: center; gap: 8px; font-weight: 800; width: calc(var(--cs) * 4 + 18px); max-width: 100%; }
  .basket .bbar { flex: 1; height: 14px; background: #000; box-shadow: 0 0 0 2px var(--line); } .basket .bbar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .25s; }
  .tile.pot { position: relative; background: radial-gradient(circle at 50% 62%, #5a4030 0 42%, #3b2a1e 44%); overflow: visible; }
  .tile.pot::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; pointer-events: none;
    background: conic-gradient(var(--ring, #56B4E9) calc(var(--g, 0) * 360deg), rgba(255,255,255,.08) 0);
    -webkit-mask: radial-gradient(circle, transparent 60%, #000 62%); mask: radial-gradient(circle, transparent 60%, #000 62%); }
  .tile.pot.ripe { --ring: #3ddc97; animation: none; box-shadow: inset 0 0 0 2px var(--line); } .tile.pot.late { --ring: #D55E00; } .tile.pot.perfect { --ring: #F0E442; box-shadow: inset 0 0 0 3px #F0E442; }
  .gardenwrap { position: relative; } .tile.pot img { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .tile.pot .pl { position: relative; display: inline-block; width: 70%; height: 70%; transition: transform .3s; }
  .tile.pot .b img { width: calc(var(--cs) * .32); height: calc(var(--cs) * .32); } .tile.pot.hasbug .bug img { width: calc(var(--cs) * .42); height: calc(var(--cs) * .42); } .tile.pot.tiny .pl { transform: scale(.8) translateY(10%); } .tile.pot.ripe .pl { animation: pop .9s ease-in-out infinite; }
  .tile.pot .b { position: absolute; font-style: normal; font-size: calc(var(--cs) * .3); display: none; pointer-events: none; line-height: 1; }
  .tile.pot.dry .thirst { display: block; left: 2px; top: 2px; } .tile.pot.dry .pl { filter: saturate(.4) brightness(.8); }
  .tile.pot.hasbug .bug { display: block; right: 2px; bottom: 4px; font-size: calc(var(--cs) * .38); animation: wig .25s steps(2) infinite; }
  .tile.pot.perfect .spark { display: block; right: 2px; top: 2px; }
  .tile.pot .fly { display: block; left: 50%; top: 10%; transform: translateX(-50%); opacity: 0; font-weight: 900; color: #F0E442; font-size: calc(var(--cs) * .26); text-shadow: 0 1px 0 #000; white-space: nowrap; }
  .tile.pot .fly.go { animation: flyup .8s ease-out; } .tile.pot.no { animation: shake .25s; }
  @keyframes flyup { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -26px); } }
  @keyframes wig { 50% { transform: rotate(14deg) translateX(2px); } }
  @media (prefers-reduced-motion: reduce) { .tile.pot.ripe .pl, .tile.pot.hasbug .bug, .tile.pot .fly.go, .tile.pot.no { animation: none; } .tile.pot .fly.go { opacity: 1; } }
  /* Minigame art (PixelLab pictures in assets/pixellab/mg/). The world class (moon / mars) is set on the card by js/game.js.
     Selectors start with .mg so they win over the plain board styles further down. */
  .mg .mcard .back { background: #23305a url(assets/pixellab/mg/cardback.png) center / 100% 100%; image-rendering: pixelated; color: transparent; }
  .mg .zip { background: linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.28)), url(assets/pixellab/mg/ground-moon.png) 0 0 / calc(var(--cs) * 2) calc(var(--cs) * 2); background-color: #2b2f3a; image-rendering: pixelated; }
  .mars .mg .zip { background-image: linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.28)), url(assets/pixellab/mg/ground-mars.png); }
  .mg .boxes i.good { background: url(assets/pixellab/mg/sandbag.png) 0 0 / var(--cs) var(--cs); image-rendering: pixelated; }
  .mg .pipe { background: #2b2f3a url(assets/pixellab/mg/steel.png) center / 100% 100%; image-rendering: pixelated; } .mg .pipe svg { filter: drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
  .mg .pipe.wet { box-shadow: inset 0 0 0 999px rgba(30,90,160,.35); }
  .mg .tiles.panel .tile { background: #1d3a6b url(assets/pixellab/mg/solar.png) center / 100% 100%; image-rendering: pixelated; } .mg .tiles.panel .tile img { width: 90%; height: 90%; image-rendering: pixelated; display: block; margin: auto; }
  /* new games: valve sequence, rock sorter, calm breathing (js/minigames.js) */
